name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test wheel on py-${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [py312, py313]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          environments: ${{ matrix.python-version }}
          cache: true

      - name: Build package
        run: |
          pixi run wheel-build

      - name: Test wheel
        run: |
          pixi run wheel-test

  converted-assets:
    name: Check the converted assets of the release
    # The wheel's `mhr-download-assets --lod` needs them, so publish only a
    # release whose converted assets come from its assets.zip (see
    # CONTRIBUTING.md).
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/check-release-assets.yml
    with:
      release: ${{ github.ref_name }}

  publish:
    name: Build and publish to PyPI
    needs: [test, converted-assets]
    # Publish only from version tags. A manual run from a branch runs the
    # tests and skips this job.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          cache: true

      - name: Build package
        run: |
          pixi run wheel-build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          verbose: true
