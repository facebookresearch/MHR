# TEMPORARY: checks the publish guard expression on this PR. Remove before merge.
name: Temporary publish guard check

on:
  pull_request:

permissions:
  contents: read

jobs:
  guard-on-this-ref:
    name: Exact publish guard (expect skipped on a PR)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - run: echo "guard passed for ${{ github.ref }}"

  guard-table:
    name: Guard on sample refs
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate
        run: |
          echo "this PR ref ${{ github.ref }} -> ${{ startsWith(github.ref, 'refs/tags/v') }}"
          echo "refs/tags/v1.1.0 -> ${{ startsWith('refs/tags/v1.1.0', 'refs/tags/v') }}"
          echo "refs/heads/main -> ${{ startsWith('refs/heads/main', 'refs/tags/v') }}"
          echo "refs/heads/PyPI-fix -> ${{ startsWith('refs/heads/PyPI-fix', 'refs/tags/v') }}"
          echo "refs/heads/v1.1.0 -> ${{ startsWith('refs/heads/v1.1.0', 'refs/tags/v') }}"
          echo "refs/tags/test -> ${{ startsWith('refs/tags/test', 'refs/tags/v') }}"
