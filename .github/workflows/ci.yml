name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: py-${{ matrix.python-version }}-${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux only (pymomentum-gpu only available on Linux)
          - os: ubuntu-latest
            platform: linux-64
            python-version: py312
          - os: ubuntu-latest
            platform: linux-64
            python-version: py313
          - os: ubuntu-latest
            platform: linux-64
            python-version: py314
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          environments: ${{ matrix.python-version }}
          cache: true

      - name: Run tests
        run: |
          pixi run -e ${{ matrix.python-version }} test

      - name: Download and unzip assets
        run: |
          pixi run -e ${{ matrix.python-version }} download-assets

      - name: Test asset conversion and the pure-PyTorch rig on the real assets
        run: |
          MHR_TEST_ASSETS=assets pixi run -e ${{ matrix.python-version }} pytest scripts/tests/test_asset_conversion.py scripts/tests/test_torch_rig_parity.py scripts/tests/test_pure_torch_runtime.py -v

      - name: Test demo
        run: |
          pixi run -e ${{ matrix.python-version }} demo
